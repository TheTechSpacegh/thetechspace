# Frontend CI: lint + build on every push and pull request.
#
# Render deploys the site itself (render.yaml, autoDeployTrigger: checksPass),
# and only after this check passes on main, so a broken build never ships.

name: Frontend

on:
  push:
    branches: [main, Dashboard]
    paths-ignore: ["Backend/**", "**/*.md"]
  # No path filter on PRs: a required check that never reports would block merging.
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  check:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # This build only checks the code; Render builds the deployed site
          # with its own VITE_API_URL (render.yaml).
          VITE_API_URL: https://api.example.com

      - name: Bundle size
        run: |
          {
            echo "### Bundle"
            echo '```'
            du -sh dist
            ls -S dist/assets | head -8 | while read f; do du -h "dist/assets/$f"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
